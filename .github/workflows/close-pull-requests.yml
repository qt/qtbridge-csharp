name: Close pull requests

# The repository is a mirror of Gerrit, so pull requests cannot be merged here.
# pull_request_target grants write access for pull requests from forks. The
# workflow never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [ opened, reopened ]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.repository == 'qt/qtbridge-csharp'
    runs-on: ubuntu-latest
    steps:
      - name: Close with a pointer to Gerrit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --repo "$REPO" --comment "Thank you for your contribution. \
          This repository is a mirror, and pull requests cannot be merged here. Please submit \
          your change for review on the Qt Project's Gerrit server as described in \
          [CONTRIBUTING.md](https://github.com/$REPO/blob/dev/.github/CONTRIBUTING.md)."
