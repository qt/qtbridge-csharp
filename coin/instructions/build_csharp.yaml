type: Group
instructions:

  - type: EnvironmentVariable
    variableName: CMAKE_PREFIX_PATH
    variableValue: "\\users\\qt\\work\\install"
  - type: EnvironmentVariable
    variableName: QtInstallRoot
    variableValue: "\\users\\qt\\work\\install"

  - type: ChangeDirectory
    directory: "{{.AgentWorkingDir}}/qt/qtbridge-csharp"
    maxTimeInSeconds: 300
    maxTimeBetweenOutput: 120
    userMessageOnFailure: >
      Failed to change to csharp dir

  - type: ExecuteCommand
    command: ["dotnet", "build", "-c", "Debug"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to build csharp for debug target.

  - type: ExecuteCommand
    command: ["dotnet", "build", "-c", "Release"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
      Failed to build csharp for release target.

  - type: ExecuteCommand
    command: ["dotnet", "test", "-c", "Release", "--no-build"]
    maxTimeInSeconds: 12000
    maxTimeBetweenOutput: 6000
    userMessageOnFailure: >
      Failed to run test for release target.

  - type: MakeDirectory
    directory: "{{.AgentWorkingDir}}\\artifacts"
  - type: ExecuteCommand
    command: ["cmd.exe", "/C", "copy",  "{{.AgentWorkingDir}}\\qt\\qtbridge-csharp\\nuget\\Qt.Bridge.CSharp.Package\\bin\\Release\\*.nupkg", "{{.AgentWorkingDir}}\\artifacts"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 2000
    userMessageOnFailure: >
      Failed to copy release nupkg package.
  - type: ExecuteCommand
    command: ["cmd.exe", "/C", "copy",  "{{.AgentWorkingDir}}\\qt\\qtbridge-csharp\\nuget\\Qt.Bridge.CSharp.Templates\\bin\\Release\\*.nupkg", "{{.AgentWorkingDir}}\\artifacts"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 2000
    userMessageOnFailure: >
      Failed to copy release nupkg template.
  - type: ExecuteCommand
    command: ["cmd.exe", "/C", "copy", "{{.AgentWorkingDir}}\\qt\\qtbridge-csharp\\src\\Qt.Bridge.CSharp.VisualStudio.Extension\\bin\\Release\\net472\\Qt.Bridge.CSharp.vsix", "{{.AgentWorkingDir}}\\artifacts"]
    maxTimeInSeconds: 6000
    maxTimeBetweenOutput: 2000
    userMessageOnFailure: >
      Failed to copy vsxi.

  - type: UploadArtifact
    archiveDirectory: "{{.AgentWorkingDir}}\\artifacts"
    transferType: UploadModuleBuildArtifact
    maxTimeInSeconds: 1200
    maxTimeBetweenOutput: 1200
