<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Science - atom on dark-navy background -->
  <rect width="100" height="100" rx="14" fill="#0d1a2e"/>
  <!-- Electron orbits -->
  <ellipse cx="50" cy="50" rx="38" ry="15"
    fill="none" stroke="#3ec9a0" stroke-width="1.5"/>
  <ellipse cx="50" cy="50" rx="38" ry="15"
    fill="none" stroke="#3ec9a0" stroke-width="1.5"
    transform="rotate(60 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="15"
    fill="none" stroke="#3ec9a0" stroke-width="1.5"
    transform="rotate(120 50 50)"/>
  <!-- Electrons (one per orbit) -->
  <circle cx="88" cy="50" r="3" fill="#7aefd0"/>
  <circle cx="31" cy="23" r="3" fill="#7aefd0" transform="rotate(60 50 50)"/>
  <circle cx="31" cy="77" r="3" fill="#7aefd0" transform="rotate(120 50 50)"/>
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="8" fill="#f0a030"/>
  <circle cx="50" cy="50" r="5" fill="#ffd060"/>
</svg>
