<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fiction - rocket in space on near-black background -->
  <rect width="100" height="100" rx="14" fill="#080c14"/>
  <!-- Stars -->
  <circle cx="18" cy="18" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="74" cy="12" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="86" cy="38" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="12" cy="62" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="82" cy="70" r="1"   fill="white" opacity="0.8"/>
  <circle cx="28" cy="82" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="90" cy="85" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="60" cy="22" r="0.7" fill="white" opacity="0.6"/>
  <!-- Rocket body -->
  <path d="M50,16 C45,28 41,46 41,60 L59,60 C59,46 55,28 50,16 Z" fill="#c8d4e8"/>
  <path d="M50,16 C50,16 45,28 41,60 L50,60 Z" fill="#a0b0cc"/>
  <!-- Wings -->
  <path d="M41,52 L30,68 L41,63 Z" fill="#c05040"/>
  <path d="M59,52 L70,68 L59,63 Z" fill="#c05040"/>
  <!-- Engine glow -->
  <ellipse cx="50" cy="60" rx="9" ry="4" fill="#f07820" opacity="0.9"/>
  <!-- Flame -->
  <path d="M44,60 C44,70 47,76 50,80 C53,76 56,70 56,60 Z" fill="#f07820"/>
  <path d="M46,60 C46,68 48,72 50,75 C52,72 54,68 54,60 Z" fill="#ffe040"/>
  <!-- Window -->
  <circle cx="50" cy="42" r="5" fill="#3a6fa8" stroke="#8ab0d0" stroke-width="1"/>
  <circle cx="50" cy="42" r="3" fill="#5090cc" opacity="0.7"/>
</svg>
