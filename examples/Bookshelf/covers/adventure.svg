<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Adventure - compass on deep-blue background -->
  <rect width="100" height="100" rx="14" fill="#162340"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#3d6ea8" stroke-width="2"/>
  <!-- Tick marks at cardinal points -->
  <line x1="50" y1="14" x2="50" y2="22" stroke="#3d6ea8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="86" stroke="#3d6ea8" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="22" y2="50" stroke="#3d6ea8" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="86" y2="50" stroke="#3d6ea8" stroke-width="2" stroke-linecap="round"/>
  <!-- N needle (red) -->
  <polygon points="50,20 53.5,50 50,46 46.5,50" fill="#d94f3d"/>
  <!-- S needle (grey) -->
  <polygon points="50,80 53.5,50 50,54 46.5,50" fill="#8899bb"/>
  <!-- Centre pip -->
  <circle cx="50" cy="50" r="4" fill="#d4c07a" stroke="#162340" stroke-width="1.5"/>
</svg>
